<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium AI Courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0a0e1f;
    --bg-1: #0f1530;
    --bg-2: #141b3d;
    --glass: rgba(255,255,255,0.045);
    --glass-border: rgba(255,255,255,0.09);
    --glass-border-hover: rgba(124,143,255,0.45);
    --blue: #4f7cff;
    --blue-bright: #6a93ff;
    --violet: #8b5cf6;
    --gold: #f5c76b;
    --text-hi: #f1f4fc;
    --text-mid: #aab3d1;
    --text-low: #6c7699;
    --success: #43d18b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, var(--bg-2) 0%, var(--bg-1) 45%, var(--bg-0) 100%);
    color: var(--text-hi);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  h1, h2, h3, .display {
    font-family: 'Sora', sans-serif;
  }

  /* ---------- Signature background: drifting neural constellation ---------- */
  #network-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.55;
  }

  .glow-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
  }
  .glow-orb.a {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(79,124,255,0.25), transparent 70%);
    top: -150px; left: -100px;
  }
  .glow-orb.b {
    width: 460px; height: 460px;
    background: radial-gradient(circle, rgba(139,92,246,0.20), transparent 70%);
    bottom: -180px; right: -120px;
  }

  /* ---------- Layout shell ---------- */
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 28px;
  }

  header.hero {
    padding: 96px 28px 64px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--blue-bright);
    background: rgba(79,124,255,0.10);
    border: 1px solid rgba(79,124,255,0.25);
    padding: 7px 16px;
    border-radius: 999px;
    margin-bottom: 28px;
    font-weight: 600;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--blue-bright);
    box-shadow: 0 0 8px var(--blue-bright);
  }

  h1.title {
    font-size: clamp(38px, 6vw, 64px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.08;
    background: linear-gradient(135deg, #ffffff 20%, #b9c6ff 65%, #8b5cf6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.subtitle {
    margin: 22px auto 0;
    max-width: 560px;
    font-size: 18px;
    line-height: 1.6;
    color: var(--text-mid);
    font-weight: 400;
  }

  /* ---------- Grid ---------- */
  .catalog {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    padding: 20px 28px 120px;
    max-width: 1180px;
    margin: 0 auto;
  }

  @media (max-width: 980px) {
    .catalog { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 620px) {
    .catalog { grid-template-columns: 1fr; padding-left: 20px; padding-right: 20px; }
    header.hero { padding: 72px 20px 48px; }
  }

  /* ---------- Card ---------- */
  .card {
    position: relative;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 26px 22px 24px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s ease, border-color 0.35s ease, background 0.35s ease;
    animation: rise 0.6s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card:hover {
    transform: translateY(-9px);
    border-color: var(--glass-border-hover);
    background: rgba(255,255,255,0.065);
    box-shadow: 0 24px 48px -18px rgba(20,30,80,0.65), 0 0 0 1px rgba(124,143,255,0.12);
  }

  .badge {
    position: absolute;
    top: -11px;
    left: 22px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.09em;
    color: #1a1408;
    background: linear-gradient(120deg, var(--gold), #ffdf9e);
    padding: 5px 12px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(245,199,107,0.35);
  }

  .icon-tile {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(79,124,255,0.22), rgba(139,92,246,0.22));
    border: 1px solid rgba(124,143,255,0.25);
    margin-top: 6px;
  }
  .icon-tile svg { width: 26px; height: 26px; }

  h3.course-name {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text-hi);
    line-height: 1.3;
  }

  .rating {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    color: var(--text-mid);
  }
  .stars { letter-spacing: 1px; color: var(--gold); font-size: 13px; }
  .rating .num { color: var(--text-hi); font-weight: 600; }

  .features {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 4px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  .feature {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13.5px;
    color: var(--text-mid);
  }
  .feature svg {
    width: 15px; height: 15px;
    flex-shrink: 0;
    color: var(--success);
  }

  .price-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 8px;
  }
  .price {
    font-size: 26px;
    font-weight: 800;
    font-family: 'Sora', sans-serif;
    color: var(--text-hi);
  }
  .price-label {
    font-size: 12px;
    color: var(--text-low);
  }

  .enroll-btn {
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 18px;
    border: none;
    border-radius: 13px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(120deg, var(--blue), #6f8dff);
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 8px 20px -8px rgba(79,124,255,0.55);
    transition: box-shadow 0.35s ease, transform 0.2s ease, filter 0.3s ease;
  }
  .enroll-btn:hover {
    box-shadow: 0 0 0 1px rgba(124,158,255,0.5), 0 0 28px 4px rgba(79,124,255,0.55), 0 14px 30px -10px rgba(79,124,255,0.6);
    transform: translateY(-2px);
    filter: brightness(1.08);
  }
  .enroll-btn:active { transform: translateY(0); }
  .enroll-btn:focus-visible {
    outline: 2px solid var(--blue-bright);
    outline-offset: 3px;
  }
  .enroll-btn svg { width: 15px; height: 15px; transition: transform 0.3s ease; }
  .enroll-btn:hover svg { transform: translateX(3px); }

  footer {
    text-align: center;
    padding: 0 28px 70px;
    color: var(--text-low);
    font-size: 13px;
    position: relative;
    z-index: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<div class="glow-orb a"></div>
<div class="glow-orb b"></div>
<canvas id="network-bg"></canvas>

<header class="hero">
  <span class="eyebrow"><span class="dot"></span>AI Academy</span>
  <h1 class="title">Premium AI Courses</h1>
  <p class="subtitle">Choose your favourite AI course and start learning today.</p>
</header>

<main class="catalog" id="catalog"></main>

<footer>© 2026 Premium AI Academy — Learn the tools shaping tomorrow.</footer>

<script>
  // ---------------- Course data ----------------
  const courses = [
    {
      name: "ChatGPT Mastery",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#9db4ff" stroke-width="1.7"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8L12 3z"/><path d="M19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14z"/></svg>`
    },
    {
      name: "Prompt Engineering Pro",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#9db4ff" stroke-width="1.7"><path d="M4 17V7a2 2 0 012-2h8l6 6v6a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M14 5v5h5"/><path d="M8 13h8M8 16h5"/></svg>`
    },
    {
      name: "AI Image Generation",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#9db4ff" stroke-width="1.7"><rect x="3" y="4" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5.5-5.5L9 17"/></svg>`
    },
    {
      name: "AI Video Editing",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#9db4ff" stroke-width="1.7"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 9l4-2.5v11L17 15"/></svg>`
    },
    {
      name: "AI Automation",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#9db4ff" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M4.2 5.8l2.1 2.1M17.7 16.1l2.1 2.1M3 12h3M18 12h3M4.2 18.2l2.1-2.1M17.7 7.9l2.1-2.1"/></svg>`
    },
    {
      name: "AI for Students",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#9db4ff" stroke-width="1.7"><path d="M22 9L12 4 2 9l10 5 10-5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>`
    },
    {
      name: "Build AI Websites",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#9db4ff" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><circle cx="6.5" cy="6.5" r=".6" fill="#9db4ff"/><circle cx="9" cy="6.5" r=".6" fill="#9db4ff"/></svg>`
    },
    {
      name: "AI Content Creation",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#9db4ff" stroke-width="1.7"><path d="M12 20l9-9-4-4-9 9v4h4z"/><path d="M14.5 6.5L17.5 9.5"/></svg>`
    }
  ];

  const ENROLL_URL = "https://forms.gle/yhzQqiETsmXJwpTj6";

  const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12l5 5L20 6"/></svg>`;
  const arrowIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>`;

  const catalog = document.getElementById('catalog');

  courses.forEach((course, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    card.style.animationDelay = (i * 0.06) + 's';

    card.innerHTML = `
      <span class="badge">BEST SELLER</span>
      <div class="icon-tile">${course.icon}</div>
      <h3 class="course-name">${course.name}</h3>
      <div class="rating">
        <span class="stars">★★★★★</span>
        <span class="num">4.9</span> Rating
      </div>
      <div class="features">
        <div class="feature">${checkIcon}Lifetime Access</div>
        <div class="feature">${checkIcon}Certificate Included</div>
        <div class="feature">${checkIcon}Beginner Friendly</div>
      </div>
      <div class="price-row">
        <span class="price">₹1500</span>
        <span class="price-label">one-time</span>
      </div>
      <a class="enroll-btn" href="${ENROLL_URL}" target="_blank" rel="noopener noreferrer">
        Enroll Now ${arrowIcon}
      </a>
    `;
    catalog.appendChild(card);
  });

  // ---------------- Signature: ambient neural constellation ----------------
  (function networkBackground() {
    const canvas = document.getElementById('network-bg');
    const ctx = canvas.getContext('2d');
    let w, h, nodes;
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = Math.min(window.innerHeight, 900);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = h + 'px';
    }

    function initNodes() {
      const count = w < 700 ? 26 : 46;
      nodes = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.18,
        vy: (Math.random() - 0.5) * 0.18,
        r: Math.random() * 1.4 + 0.6
      }));
    }

    function step() {
      ctx.clearRect(0, 0, w, h);
      for (const n of nodes) {
        n.x += n.vx; n.y += n.vy;
        if (n.x < 0 || n.x > w) n.vx *= -1;
        if (n.y < 0 || n.y > h) n.vy *= -1;
      }
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 130) {
            ctx.strokeStyle = `rgba(124,143,255,${0.14 * (1 - dist / 130)})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
      for (const n of nodes) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(160,178,255,0.55)';
        ctx.fill();
      }
      if (!prefersReduced) requestAnimationFrame(step);
    }

    resize();
    initNodes();
    step();

    window.addEventListener('resize', () => {
      resize();
      initNodes();
      if (prefersReduced) step();
    });
  })();
</script>

</body>
</html>
